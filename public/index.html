<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaskFlow Pro — Team Task Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0b0f;
    --surface: #13151c;
    --surface2: #1c1f2b;
    --surface3: #242838;
    --border: #2a2e3f;
    --accent: #6c63ff;
    --accent2: #4ecdc4;
    --accent3: #ff6b9d;
    --warn: #f59e0b;
    --danger: #ef4444;
    --success: #22c55e;
    --text: #e8eaf0;
    --text2: #8891a8;
    --text3: #555d75;
    --radius: 12px;
    --radius-sm: 8px;
    --shadow: 0 4px 24px rgba(0,0,0,0.4);
    --shadow-lg: 0 8px 48px rgba(0,0,0,0.6);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }
  h1,h2,h3,h4 { font-family: 'Syne', sans-serif; }
  
  /* SCROLLBAR */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--surface); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  /* AUTH PAGES */
  #auth-page { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px;
    background: radial-gradient(ellipse at 20% 50%, rgba(108,99,255,0.15) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 20%, rgba(78,205,196,0.08) 0%, transparent 50%), var(--bg); }
  .auth-box { width: 100%; max-width: 420px; }
  .auth-logo { text-align: center; margin-bottom: 40px; }
  .auth-logo h1 { font-size: 2.4rem; font-weight: 800; background: linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: -1px; }
  .auth-logo p { color: var(--text2); margin-top: 6px; font-size: 0.95rem; }
  .auth-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 36px; box-shadow: var(--shadow-lg); }
  .auth-tabs { display: flex; gap: 4px; background: var(--bg); border-radius: var(--radius-sm); padding: 4px; margin-bottom: 28px; }
  .auth-tab { flex: 1; padding: 10px; border: none; background: transparent; color: var(--text2); font-family: 'DM Sans'; font-size: 0.9rem; font-weight: 500; border-radius: 6px; cursor: pointer; transition: all 0.2s; }
  .auth-tab.active { background: var(--accent); color: white; }
  .form-group { margin-bottom: 18px; }
  .form-group label { display: block; margin-bottom: 7px; font-size: 0.85rem; font-weight: 500; color: var(--text2); letter-spacing: 0.02em; }
  .form-group input, .form-group select, .form-group textarea {
    width: 100%; padding: 12px 14px; background: var(--surface2); border: 1.5px solid var(--border);
    border-radius: var(--radius-sm); color: var(--text); font-family: 'DM Sans'; font-size: 0.95rem;
    transition: border-color 0.2s, box-shadow 0.2s; outline: none; }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(108,99,255,0.15); }
  .form-group textarea { resize: vertical; min-height: 80px; }
  .form-group select option { background: var(--surface2); }
  .btn { display: inline-flex; align-items: center; gap: 8px; padding: 12px 20px; border: none; border-radius: var(--radius-sm); font-family: 'DM Sans'; font-size: 0.9rem; font-weight: 600; cursor: pointer; transition: all 0.2s; text-decoration: none; white-space: nowrap; }
  .btn-primary { background: var(--accent); color: white; }
  .btn-primary:hover { background: #7c74ff; transform: translateY(-1px); box-shadow: 0 4px 16px rgba(108,99,255,0.4); }
  .btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
  .btn-secondary:hover { background: var(--surface3); }
  .btn-danger { background: rgba(239,68,68,0.15); color: var(--danger); border: 1px solid rgba(239,68,68,0.3); }
  .btn-danger:hover { background: rgba(239,68,68,0.25); }
  .btn-success { background: rgba(34,197,94,0.15); color: var(--success); border: 1px solid rgba(34,197,94,0.3); }
  .btn-success:hover { background: rgba(34,197,94,0.25); }
  .btn-sm { padding: 7px 12px; font-size: 0.82rem; }
  .btn-full { width: 100%; justify-content: center; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; }
  .error-msg { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); color: #fca5a5; padding: 10px 14px; border-radius: var(--radius-sm); font-size: 0.875rem; margin-bottom: 16px; }
  .success-msg { background: rgba(34,197,94,0.1); border: 1px solid rgba(34,197,94,0.3); color: #86efac; padding: 10px 14px; border-radius: var(--radius-sm); font-size: 0.875rem; margin-bottom: 16px; }

  /* MAIN LAYOUT */
  #app { display: none; min-height: 100vh; flex-direction: column; }
  .topbar { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 24px; height: 60px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; backdrop-filter: blur(10px); }
  .topbar-logo { font-family: 'Syne'; font-weight: 800; font-size: 1.3rem; background: linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .topbar-right { display: flex; align-items: center; gap: 12px; }
  .user-chip { display: flex; align-items: center; gap: 8px; background: var(--surface2); border: 1px solid var(--border); border-radius: 99px; padding: 6px 14px 6px 8px; }
  .avatar { width: 28px; height: 28px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), var(--accent2)); display: flex; align-items: center; justify-content: center; font-family: 'Syne'; font-weight: 700; font-size: 0.75rem; color: white; flex-shrink: 0; }
  .user-chip span { font-size: 0.875rem; font-weight: 500; color: var(--text2); }
  
  .main-content { display: flex; flex: 1; }
  .sidebar { width: 240px; background: var(--surface); border-right: 1px solid var(--border); padding: 20px 12px; display: flex; flex-direction: column; gap: 6px; min-height: calc(100vh - 60px); flex-shrink: 0; }
  .sidebar-label { font-size: 0.72rem; font-weight: 700; color: var(--text3); letter-spacing: 0.1em; text-transform: uppercase; padding: 8px 12px 4px; }
  .nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: var(--radius-sm); cursor: pointer; color: var(--text2); font-size: 0.9rem; font-weight: 500; transition: all 0.15s; border: none; background: transparent; width: 100%; text-align: left; }
  .nav-item:hover { background: var(--surface2); color: var(--text); }
  .nav-item.active { background: rgba(108,99,255,0.15); color: var(--accent); }
  .nav-item .icon { font-size: 1.1rem; width: 20px; text-align: center; }
  .badge { margin-left: auto; background: var(--accent); color: white; border-radius: 99px; padding: 1px 7px; font-size: 0.72rem; font-weight: 700; }
  
  .page { flex: 1; padding: 28px 32px; overflow-y: auto; max-height: calc(100vh - 60px); }
  .page-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 28px; flex-wrap: wrap; gap: 16px; }
  .page-title { font-size: 1.8rem; font-weight: 800; letter-spacing: -0.5px; }
  .page-subtitle { color: var(--text2); margin-top: 4px; font-size: 0.9rem; }

  /* DASHBOARD */
  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 28px; }
  .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px; position: relative; overflow: hidden; transition: border-color 0.2s; }
  .stat-card:hover { border-color: var(--accent); }
  .stat-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--card-color, var(--accent)); }
  .stat-card .stat-val { font-family: 'Syne'; font-size: 2.4rem; font-weight: 800; color: var(--card-color, var(--accent)); line-height: 1; margin-bottom: 6px; }
  .stat-card .stat-label { color: var(--text2); font-size: 0.85rem; }
  .stat-card .stat-icon { position: absolute; top: 20px; right: 20px; font-size: 1.8rem; opacity: 0.15; }

  /* PROJECTS GRID */
  .projects-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
  .project-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px; cursor: pointer; transition: all 0.2s; position: relative; overflow: hidden; }
  .project-card::before { content: ''; position: absolute; top: 0; left: 0; bottom: 0; width: 4px; background: linear-gradient(180deg, var(--accent), var(--accent2)); border-radius: 4px 0 0 4px; }
  .project-card:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: var(--shadow); }
  .project-card h3 { font-size: 1.05rem; font-weight: 700; margin-bottom: 6px; padding-left: 12px; }
  .project-card p { color: var(--text2); font-size: 0.85rem; padding-left: 12px; margin-bottom: 16px; min-height: 38px; }
  .project-meta { display: flex; gap: 12px; padding-left: 12px; }
  .meta-pill { display: flex; align-items: center; gap: 5px; background: var(--surface2); border-radius: 99px; padding: 4px 10px; font-size: 0.78rem; color: var(--text2); }
  .progress-bar { height: 4px; background: var(--surface2); border-radius: 2px; margin: 14px 0 14px 12px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 2px; transition: width 0.5s ease; }

  /* PROJECT DETAIL */
  .project-nav { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 24px; }
  .project-tab { padding: 10px 18px; border: none; background: transparent; color: var(--text2); font-family: 'DM Sans'; font-weight: 500; font-size: 0.9rem; cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.15s; margin-bottom: -1px; }
  .project-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .project-tab:hover { color: var(--text); }

  /* TASK BOARD (KANBAN) */
  .kanban { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; min-height: 500px; }
  .kanban-col { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 10px; min-height: 400px; }
  .kanban-col-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .kanban-col-title { font-family: 'Syne'; font-weight: 700; font-size: 0.85rem; letter-spacing: 0.05em; text-transform: uppercase; }
  .col-count { background: var(--surface2); color: var(--text2); border-radius: 99px; padding: 2px 8px; font-size: 0.75rem; font-weight: 600; }
  .task-card { background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 14px; cursor: pointer; transition: all 0.15s; }
  .task-card:hover { border-color: var(--accent); box-shadow: 0 2px 12px rgba(108,99,255,0.15); transform: translateY(-1px); }
  .task-title { font-weight: 600; font-size: 0.9rem; margin-bottom: 8px; line-height: 1.4; }
  .task-meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .priority-badge { border-radius: 4px; padding: 2px 7px; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.05em; }
  .priority-low { background: rgba(34,197,94,0.15); color: var(--success); }
  .priority-medium { background: rgba(245,158,11,0.15); color: var(--warn); }
  .priority-high { background: rgba(239,68,68,0.15); color: var(--danger); }
  .priority-critical { background: rgba(239,68,68,0.3); color: #ff8080; border: 1px solid rgba(239,68,68,0.4); }
  .assignee-chip { display: flex; align-items: center; gap: 4px; background: var(--surface3); border-radius: 99px; padding: 2px 8px 2px 3px; font-size: 0.75rem; color: var(--text2); margin-left: auto; }
  .assignee-chip .avatar { width: 18px; height: 18px; font-size: 0.6rem; }
  .due-tag { font-size: 0.72rem; color: var(--text3); }
  .due-tag.overdue { color: var(--danger); }

  /* TASK LIST VIEW */
  .task-list { display: flex; flex-direction: column; gap: 8px; }
  .task-row { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 14px 18px; display: flex; align-items: center; gap: 14px; cursor: pointer; transition: all 0.15s; }
  .task-row:hover { border-color: var(--accent); }
  .task-row .task-title { flex: 1; font-size: 0.9rem; }
  .task-row .meta-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }

  /* STATUS DOTS */
  .status-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .status-todo { background: var(--text3); }
  .status-in_progress { background: var(--accent); }
  .status-in_review { background: var(--warn); }
  .status-done { background: var(--success); }

  /* MEMBERS */
  .members-list { display: flex; flex-direction: column; gap: 10px; }
  .member-row { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 14px 18px; display: flex; align-items: center; gap: 14px; }
  .member-info { flex: 1; }
  .member-name { font-weight: 600; font-size: 0.9rem; }
  .member-email { color: var(--text2); font-size: 0.8rem; margin-top: 2px; }
  .role-badge { border-radius: 99px; padding: 3px 10px; font-size: 0.78rem; font-weight: 600; }
  .role-Admin { background: rgba(108,99,255,0.2); color: var(--accent); }
  .role-Member { background: rgba(78,205,196,0.15); color: var(--accent2); }

  /* MODAL */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 28px; width: 100%; max-width: 520px; box-shadow: var(--shadow-lg); max-height: 90vh; overflow-y: auto; }
  .modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
  .modal-title { font-family: 'Syne'; font-weight: 700; font-size: 1.2rem; }
  .modal-close { background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; color: var(--text2); width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 1.1rem; transition: all 0.15s; }
  .modal-close:hover { background: var(--surface3); color: var(--text); }
  .modal-footer { display: flex; gap: 10px; justify-content: flex-end; margin-top: 24px; }

  /* TOAST */
  #toast-container { position: fixed; bottom: 24px; right: 24px; z-index: 2000; display: flex; flex-direction: column; gap: 8px; }
  .toast { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px 18px; font-size: 0.875rem; box-shadow: var(--shadow); display: flex; align-items: center; gap: 10px; animation: slideIn 0.3s ease; min-width: 240px; }
  .toast.success { border-left: 3px solid var(--success); }
  .toast.error { border-left: 3px solid var(--danger); }
  .toast.info { border-left: 3px solid var(--accent); }
  @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

  /* EMPTY STATES */
  .empty-state { text-align: center; padding: 60px 20px; color: var(--text2); }
  .empty-state .empty-icon { font-size: 3rem; margin-bottom: 16px; opacity: 0.5; }
  .empty-state h3 { font-size: 1.1rem; color: var(--text); margin-bottom: 8px; }
  .empty-state p { font-size: 0.875rem; margin-bottom: 20px; }

  /* TASK DETAIL */
  .task-detail-grid { display: grid; grid-template-columns: 1fr 260px; gap: 24px; }
  .detail-section { margin-bottom: 20px; }
  .detail-label { font-size: 0.8rem; font-weight: 600; color: var(--text2); letter-spacing: 0.05em; text-transform: uppercase; margin-bottom: 8px; }
  .detail-sidebar { background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; display: flex; flex-direction: column; gap: 16px; align-self: start; }

  /* LOADING */
  .spinner { display: inline-block; width: 20px; height: 20px; border: 2px solid rgba(108,99,255,0.3); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-center { display: flex; align-items: center; justify-content: center; padding: 60px; }

  /* RESPONSIVE */
  @media (max-width: 900px) {
    .kanban { grid-template-columns: repeat(2, 1fr); }
    .task-detail-grid { grid-template-columns: 1fr; }
  }
  @media (max-width: 600px) {
    .sidebar { display: none; }
    .page { padding: 20px 16px; }
    .kanban { grid-template-columns: 1fr; }
    .stats-grid { grid-template-columns: repeat(2, 1fr); }
  }

  /* BREADCRUMB */
  .breadcrumb { display: flex; align-items: center; gap: 8px; color: var(--text2); font-size: 0.85rem; margin-bottom: 20px; }
  .breadcrumb a { color: var(--text2); text-decoration: none; cursor: pointer; }
  .breadcrumb a:hover { color: var(--accent); }
  .breadcrumb span { color: var(--text3); }

  /* STATUS SELECT */
  .status-select-pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 99px; padding: 6px 14px; font-size: 0.85rem; font-weight: 600; cursor: pointer; border: none; font-family: 'DM Sans'; transition: all 0.15s; }
  .status-todo.pill { background: rgba(85,93,117,0.3); color: var(--text2); }
  .status-in_progress.pill { background: rgba(108,99,255,0.2); color: var(--accent); }
  .status-in_review.pill { background: rgba(245,158,11,0.2); color: var(--warn); }
  .status-done.pill { background: rgba(34,197,94,0.2); color: var(--success); }

  .divider { height: 1px; background: var(--border); margin: 4px 0; }

  select option { background: #13151c; color: #e8eaf0; }
</style>
</head>
<body>

<!-- AUTH PAGE -->
<div id="auth-page">
  <div class="auth-box">
    <div class="auth-logo">
      <h1>TaskFlow Pro</h1>
      <p>Team collaboration, simplified.</p>
    </div>
    <div class="auth-card">
      <div class="auth-tabs">
        <button class="auth-tab active" onclick="switchAuthTab('login')">Sign In</button>
        <button class="auth-tab" onclick="switchAuthTab('signup')">Sign Up</button>
      </div>
      <div id="auth-error" class="error-msg" style="display:none"></div>

      <!-- LOGIN FORM -->
      <form id="login-form" onsubmit="handleLogin(event)">
        <div class="form-group"><label>Email Address</label><input type="email" id="login-email" placeholder="you@example.com" required></div>
        <div class="form-group"><label>Password</label><input type="password" id="login-password" placeholder="Your password" required></div>
        <button type="submit" class="btn btn-primary btn-full" id="login-btn">Sign In</button>
      </form>

      <!-- SIGNUP FORM -->
      <form id="signup-form" style="display:none" onsubmit="handleSignup(event)">
        <div class="form-group"><label>Full Name</label><input type="text" id="signup-name" placeholder="John Doe" required></div>
        <div class="form-group"><label>Email Address</label><input type="email" id="signup-email" placeholder="you@example.com" required></div>
        <div class="form-group"><label>Password</label><input type="password" id="signup-password" placeholder="Min. 6 characters" required minlength="6"></div>
        <button type="submit" class="btn btn-primary btn-full" id="signup-btn">Create Account</button>
      </form>
    </div>
  </div>
</div>

<!-- MAIN APP -->
<div id="app">
  <div class="topbar">
    <div class="topbar-logo">TaskFlow Pro</div>
    <div class="topbar-right">
      <div class="user-chip">
        <div class="avatar" id="nav-avatar"></div>
        <span id="nav-username"></span>
      </div>
      <button class="btn btn-secondary btn-sm" onclick="logout()">Sign Out</button>
    </div>
  </div>

  <div class="main-content">
    <div class="sidebar">
      <div class="sidebar-label">Navigation</div>
      <button class="nav-item active" onclick="navigate('dashboard')" id="nav-dashboard">
        <span class="icon">📊</span> Dashboard
      </button>
      <button class="nav-item" onclick="navigate('projects')" id="nav-projects">
        <span class="icon">📁</span> My Projects
      </button>
      <button class="nav-item" onclick="navigate('tasks')" id="nav-tasks">
        <span class="icon">✅</span> All Tasks
      </button>
      <div class="divider" style="margin:8px 0"></div>
      <div class="sidebar-label">Quick Access</div>
      <button class="nav-item" onclick="showCreateProjectModal()">
        <span class="icon">➕</span> New Project
      </button>
    </div>

    <div class="page" id="page-content">
      <div class="loading-center"><div class="spinner"></div></div>
    </div>
  </div>
</div>

<!-- TOAST -->
<div id="toast-container"></div>

<!-- MODALS -->
<div id="modal-container"></div>

<script>
// ============================================================
// STATE
// ============================================================
let state = {
  token: localStorage.getItem('tf_token'),
  user: null,
  currentPage: 'dashboard',
  currentProject: null,
  currentProjectTab: 'board',
  projects: [],
  dashboardData: null
}

const API = ''  // same origin

// ============================================================
// API HELPER
// ============================================================
async function api(method, path, body) {
  const opts = {
    method,
    headers: { 'Content-Type': 'application/json' }
  }
  if (state.token) opts.headers['Authorization'] = 'Bearer ' + state.token
  if (body) opts.body = JSON.stringify(body)
  const res = await fetch(API + path, opts)
  const data = await res.json()
  if (!res.ok) throw new Error(data.error || 'Request failed')
  return data
}

// ============================================================
// AUTH
// ============================================================
function switchAuthTab(tab) {
  document.getElementById('login-form').style.display = tab === 'login' ? 'block' : 'none'
  document.getElementById('signup-form').style.display = tab === 'signup' ? 'block' : 'none'
  document.getElementById('auth-error').style.display = 'none'
  document.querySelectorAll('.auth-tab').forEach((el, i) => el.classList.toggle('active', (tab === 'login' && i === 0) || (tab === 'signup' && i === 1)))
}

async function handleLogin(e) {
  e.preventDefault()
  const btn = document.getElementById('login-btn')
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>'
  try {
    const data = await api('POST', '/api/auth/login', {
      email: document.getElementById('login-email').value,
      password: document.getElementById('login-password').value
    })
    state.token = data.token
    state.user = data.user
    localStorage.setItem('tf_token', data.token)
    showApp()
  } catch (err) {
    showAuthError(err.message)
  } finally {
    btn.disabled = false; btn.textContent = 'Sign In'
  }
}

async function handleSignup(e) {
  e.preventDefault()
  const btn = document.getElementById('signup-btn')
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>'
  try {
    const data = await api('POST', '/api/auth/signup', {
      name: document.getElementById('signup-name').value,
      email: document.getElementById('signup-email').value,
      password: document.getElementById('signup-password').value
    })
    state.token = data.token
    state.user = data.user
    localStorage.setItem('tf_token', data.token)
    showApp()
  } catch (err) {
    showAuthError(err.message)
  } finally {
    btn.disabled = false; btn.textContent = 'Create Account'
  }
}

function showAuthError(msg) {
  const el = document.getElementById('auth-error')
  el.textContent = msg; el.style.display = 'block'
}

function logout() {
  localStorage.removeItem('tf_token')
  state.token = null; state.user = null
  document.getElementById('app').style.display = 'none'
  document.getElementById('auth-page').style.display = 'flex'
}

// ============================================================
// APP INIT
// ============================================================
async function showApp() {
  if (!state.user) {
    try {
      state.user = await api('GET', '/api/auth/me')
    } catch {
      logout(); return
    }
  }
  document.getElementById('auth-page').style.display = 'none'
  document.getElementById('app').style.display = 'flex'
  document.getElementById('nav-username').textContent = state.user.name.split(' ')[0]
  document.getElementById('nav-avatar').textContent = state.user.name[0].toUpperCase()
  navigate('dashboard')
}

async function init() {
  if (state.token) {
    showApp()
  }
}

// ============================================================
// NAVIGATION
// ============================================================
function navigate(page, data) {
  state.currentPage = page
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'))
  const navEl = document.getElementById('nav-' + page)
  if (navEl) navEl.classList.add('active')
  if (page === 'dashboard') renderDashboard()
  else if (page === 'projects') renderProjects()
  else if (page === 'tasks') renderAllTasks()
  else if (page === 'project') renderProjectDetail(data)
}

function renderStatusBars(byStatus, total) {
  const statuses = [
    { key: 'todo', label: 'To Do', color: 'var(--text3)' },
    { key: 'in_progress', label: 'In Progress', color: 'var(--accent)' },
    { key: 'in_review', label: 'In Review', color: 'var(--warn)' },
    { key: 'done', label: 'Done', color: 'var(--success)' }
  ]
  return statuses.map(s => {
    const count = byStatus[s.key] || 0
    const pct = total ? Math.round(count / total * 100) : 0
    return `<div style="margin-bottom:12px">
      <div style="display:flex;justify-content:space-between;font-size:0.82rem;margin-bottom:5px">
        <span style="color:var(--text2)">${s.label}</span>
        <span style="color:${s.color};font-weight:600">${count}</span>
      </div>
      <div style="height:6px;background:var(--surface2);border-radius:3px;overflow:hidden">
        <div style="height:100%;width:${pct}%;background:${s.color};border-radius:3px;transition:width 0.5s ease"></div>
      </div>
    </div>`
  }).join('')
}

  el.innerHTML = '<div class="loading-center"><div class="spinner"></div></div>'
  try {
    const project = await api('GET', '/api/projects/' + projectId)
    state.currentProject = project
    const isAdmin = project.myRole === 'Admin'
    el.innerHTML = `
      <div class="breadcrumb">
        <a onclick="navigate('projects')">Projects</a>
        <span>/</span>
        <span>${esc(project.name)}</span>
      </div>
      <div class="page-header">
        <div>
          <div class="page-title">${esc(project.name)}</div>

        </div>
        <div style="display:flex;gap:8px">
          ${isAdmin ? `<button class="btn btn-secondary btn-sm" onclick="showInviteModal('${project.id}')">+ Invite Member</button>` : ''}

        ${renderProjectTabContent(project)}
      </div>

function switchProjectTab(tab, projectId) {
  state.currentProjectTab = tab
  document.querySelectorAll('.project-tab').forEach((el, i) => {
    el.classList.toggle('active', el.textContent.toLowerCase().startsWith(tab))
  })
  document.getElementById('project-tab-content').innerHTML = renderProjectTabContent(state.currentProject)
}

function renderProjectTabContent(project) {
  if (state.currentProjectTab === 'board') return renderKanban(project)
  if (state.currentProjectTab === 'list') return renderTaskList(project)
  if (state.currentProjectTab === 'members') return renderMemberList(project)
  return ''
}

function renderKanban(project) {
  const cols = [
    { key: 'todo', label: 'To Do' },
    { key: 'in_progress', label: 'In Progress' },
    { key: 'in_review', label: 'In Review' },
    { key: 'done', label: 'Done' }
  ]
  return `<div class="kanban">
    ${cols.map(col => {
      const tasks = project.tasks.filter(t => t.status === col.key)
      return `
        <div class="kanban-col">
          <div class="kanban-col-header">
            <div class="kanban-col-title" style="color:${colColor(col.key)}">${col.label}</div>
            <span class="col-count">${tasks.length}</span>
          </div>
          ${tasks.length === 0 ? '<div style="color:var(--text3);font-size:0.8rem;padding:12px 0;text-align:center">No tasks</div>' :
            tasks.map(t => renderTaskCard(t)).join('')}
        </div>`
    }).join('')}
  </div>`
}

function colColor(status) {
  const m = { todo: 'var(--text3)', in_progress: 'var(--accent)', in_review: 'var(--warn)', done: 'var(--success)' }
  return m[status] || 'var(--text2)'
}

function renderTaskCard(t) {
  const now = new Date()
  const overdue = t.dueDate && new Date(t.dueDate) < now && t.status !== 'done'
  return `
    <div class="task-card" onclick="showTaskDetail('${t.id}')">
      <div class="task-title">${esc(t.title)}</div>
      <div class="task-meta">
        <span class="priority-badge priority-${t.priority}">${t.priority}</span>
        ${t.dueDate ? `<span class="due-tag ${overdue ? 'overdue' : ''}">📅 ${formatDate(t.dueDate)}</span>` : ''}
        ${t.assignee ? `<div class="assignee-chip"><div class="avatar">${t.assignee.name[0]}</div>${t.assignee.name.split(' ')[0]}</div>` : ''}
      </div>
    </div>`
}

function renderTaskList(project) {
  if (project.tasks.length === 0) return `<div class="empty-state"><div class="empty-icon">📋</div><h3>No tasks yet</h3><p>Create your first task for this project.</p><button class="btn btn-primary" onclick="showCreateTaskModal('${project.id}')">Add Task</button></div>`
  return `<div class="task-list">
    ${project.tasks.sort((a,b) => new Date(b.updatedAt) - new Date(a.updatedAt)).map(t => {
      const now = new Date()
      const overdue = t.dueDate && new Date(t.dueDate) < now && t.status !== 'done'
      return `<div class="task-row" onclick="showTaskDetail('${t.id}')">
        <div class="status-dot status-${t.status}"></div>
        <div class="task-title">${esc(t.title)}</div>
        <div class="meta-right">
          <span class="priority-badge priority-${t.priority}">${t.priority}</span>
          ${t.dueDate ? `<span class="due-tag ${overdue ? 'overdue' : ''}">${formatDate(t.dueDate)}</span>` : ''}
          ${t.assignee ? `<div class="assignee-chip"><div class="avatar">${t.assignee.name[0]}</div>${t.assignee.name.split(' ')[0]}</div>` : '<span style="color:var(--text3);font-size:0.8rem">Unassigned</span>'}
        </div>
      </div>`
    }).join('')}
  </div>`
}

function renderMemberList(project) {
  const isAdmin = project.myRole === 'Admin'
  return `<div class="members-list">
    ${project.members.map(m => `
      <div class="member-row">
        <div class="avatar" style="width:36px;height:36px;font-size:1rem">${m.user?.name[0] || '?'}</div>
        <div class="member-info">
          <div class="member-name">${esc(m.user?.name || 'Unknown')}</div>
          <div class="member-email">${esc(m.user?.email || '')}</div>
        </div>
        <span class="role-badge role-${m.role}">${m.role}</span>
        ${isAdmin && m.userId !== state.user.id ? `
          <div style="display:flex;gap:6px">
            <button class="btn btn-secondary btn-sm" onclick="changeMemberRole('${project.id}', '${m.userId}', '${m.role === 'Admin' ? 'Member' : 'Admin'}')">
              → ${m.role === 'Admin' ? 'Member' : 'Admin'}
            </button>
            <button class="btn btn-danger btn-sm" onclick="removeMember('${project.id}', '${m.userId}')">Remove</button>
          </div>` : ''}
      </div>`).join('')}
  </div>`
}

async function renderAllTasks() {
  const el = document.getElementById('page-content')
  el.innerHTML = '<div class="loading-center"><div class="spinner"></div></div>'
  try {
    const tasks = await api('GET', '/api/tasks')
    const now = new Date()
    el.innerHTML = `
      <div class="page-header">
        <div>
          <div class="page-title">All Tasks</div>
          <div class="page-subtitle">${tasks.length} tasks across all your projects</div>
        </div>
        <div style="display:flex;gap:8px">
          <select onchange="filterTasksView(this.value)" style="background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);padding:8px 12px;font-family:'DM Sans';font-size:0.875rem" id="task-filter">
            <option value="all">All Tasks</option>
            <option value="mine">Assigned to Me</option>
            <option value="overdue">Overdue</option>
            <option value="todo">To Do</option>
            <option value="in_progress">In Progress</option>
            <option value="done">Done</option>
          </select>
        </div>
      </div>
      <div id="tasks-list-container">
        ${renderFilteredTasks(tasks, 'all', now)}
      </div>
    `
    window._allTasks = tasks
  } catch (err) {
    el.innerHTML = `<div class="error-msg">${err.message}</div>`
  }
}

function filterTasksView(filter) {
  document.getElementById('tasks-list-container').innerHTML = renderFilteredTasks(window._allTasks, filter, new Date())
}

function renderFilteredTasks(tasks, filter, now) {
  let filtered = tasks
  if (filter === 'mine') filtered = tasks.filter(t => t.assigneeId === state.user.id)
  else if (filter === 'overdue') filtered = tasks.filter(t => t.dueDate && new Date(t.dueDate) < now && t.status !== 'done')
  else if (['todo', 'in_progress', 'in_review', 'done'].includes(filter)) filtered = tasks.filter(t => t.status === filter)

  if (filtered.length === 0) return `<div class="empty-state"><div class="empty-icon">🔍</div><h3>No tasks found</h3><p>Try a different filter.</p></div>`
  return `<div class="task-list">
    ${filtered.map(t => {
      const overdue = t.dueDate && new Date(t.dueDate) < now && t.status !== 'done'
      return `<div class="task-row" onclick="showTaskDetail('${t.id}')">
        <div class="status-dot status-${t.status}"></div>
        <div style="flex:1;min-width:0">
          <div style="font-weight:500;font-size:0.9rem">${esc(t.title)}</div>
          <div style="font-size:0.78rem;color:var(--text2);margin-top:2px">${esc(t.projectName)}</div>
        </div>
        <div class="meta-right">
          <span class="priority-badge priority-${t.priority}">${t.priority}</span>
          ${t.dueDate ? `<span class="due-tag ${overdue ? 'overdue' : ''}">${formatDate(t.dueDate)}</span>` : ''}
          ${t.assignee ? `<div class="assignee-chip"><div class="avatar">${t.assignee.name[0]}</div>${t.assignee.name.split(' ')[0]}</div>` : ''}
        </div>
      </div>`
    }).join('')}
  </div>`
}

// ============================================================
// TASK DETAIL MODAL
// ============================================================
async function showTaskDetail(taskId) {
  const task = state.currentProject?.tasks.find(t => t.id === taskId) ||
               window._allTasks?.find(t => t.id === taskId)
  if (!task) return

  const project = state.currentProject || { myRole: 'Member', members: [] }
  const isAdmin = project.myRole === 'Admin'
  const isCreator = task.createdBy === state.user.id
  const isAssignee = task.assigneeId === state.user.id
  const canEdit = isAdmin || isCreator
  const canStatus = isAdmin || isCreator || isAssignee

  const statusOptions = ['todo', 'in_progress', 'in_review', 'done']
  const priorityOptions = ['low', 'medium', 'high', 'critical']

  showModal(`
    <div class="modal-header">
      <div class="modal-title">${esc(task.title)}</div>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div id="task-detail-msg"></div>
    <div style="display:flex;flex-direction:column;gap:18px">
      ${canEdit ? `<div class="form-group"><label>Title</label><input id="td-title" value="${esc(task.title)}"></div>` :
        `<div style="font-size:1rem;font-weight:600">${esc(task.title)}</div>`}
      
      ${canEdit ? `<div class="form-group"><label>Description</label><textarea id="td-desc">${esc(task.description)}</textarea></div>` :
        task.description ? `<p style="color:var(--text2);font-size:0.9rem">${esc(task.description)}</p>` : ''}

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div class="form-group">
          <label>Status</label>
          ${canStatus ? `<select id="td-status">${statusOptions.map(s => `<option value="${s}" ${task.status === s ? 'selected' : ''}>${s.replace('_', ' ')}</option>`).join('')}</select>` :
            `<div class="status-dot status-${task.status}" style="display:inline-block;margin-right:6px"></div>${task.status.replace('_',' ')}`}
        </div>
        <div class="form-group">
          <label>Priority</label>
          ${canEdit ? `<select id="td-priority">${priorityOptions.map(p => `<option value="${p}" ${task.priority === p ? 'selected' : ''}>${p}</option>`).join('')}</select>` :
            `<span class="priority-badge priority-${task.priority}">${task.priority}</span>`}
        </div>
      </div>

      ${canEdit ? `<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div class="form-group"><label>Due Date</label><input type="date" id="td-due" value="${task.dueDate ? task.dueDate.split('T')[0] : ''}"></div>
        <div class="form-group"><label>Assignee</label>
          <select id="td-assignee">
            <option value="">Unassigned</option>
            ${(project.members || []).map(m => `<option value="${m.userId}" ${task.assigneeId === m.userId ? 'selected' : ''}>${m.user?.name || m.userId}</option>`).join('')}
          </select>
        </div>
      </div>` : `
        <div style="display:flex;gap:16px">
          ${task.dueDate ? `<div><div class="detail-label">Due Date</div>${formatDate(task.dueDate)}</div>` : ''}
          <div><div class="detail-label">Assignee</div>${task.assignee?.name || 'Unassigned'}</div>
        </div>`}

      <div style="background:var(--surface2);border-radius:var(--radius-sm);padding:12px;font-size:0.8rem;color:var(--text2)">
        Created by ${task.creator?.name || 'Unknown'} · ${formatDateTime(task.createdAt)}
        ${task.updatedAt !== task.createdAt ? ` · Updated ${formatDateTime(task.updatedAt)}` : ''}
      </div>
    </div>
    <div class="modal-footer">
      ${(isAdmin || isCreator) ? `<button class="btn btn-danger btn-sm" onclick="deleteTask('${task.id}')">Delete</button>` : ''}
      <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
      ${canEdit || canStatus ? `<button class="btn btn-primary" onclick="saveTaskDetail('${task.id}', ${canEdit}, ${canStatus})">Save Changes</button>` : ''}
    </div>
  `)
}

async function saveTaskDetail(taskId, canEdit, canStatus) {
  const body = {}
  if (canStatus) body.status = document.getElementById('td-status')?.value
  if (canEdit) {
    body.title = document.getElementById('td-title')?.value
    body.description = document.getElementById('td-desc')?.value
    body.priority = document.getElementById('td-priority')?.value
    body.dueDate = document.getElementById('td-due')?.value || null
    body.assigneeId = document.getElementById('td-assignee')?.value || null
  }
  try {
    await api('PATCH', '/api/tasks/' + taskId, body)
    closeModal()
    toast('Task updated!', 'success')
    refreshCurrentPage()
  } catch (err) {
    document.getElementById('task-detail-msg').innerHTML = `<div class="error-msg">${err.message}</div>`
  }
}

async function deleteTask(taskId) {
  if (!confirm('Delete this task?')) return
  try {
    await api('DELETE', '/api/tasks/' + taskId)
    closeModal()
    toast('Task deleted', 'info')
    refreshCurrentPage()
  } catch (err) {
    toast(err.message, 'error')
  }
}

// ============================================================
// MODALS
// ============================================================
function showCreateProjectModal() {
  showModal(`
    <div class="modal-header">
      <div class="modal-title">Create New Project</div>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div id="cp-msg"></div>
    <div class="form-group"><label>Project Name *</label><input id="cp-name" placeholder="e.g., Marketing Campaign Q2" autofocus></div>
    <div class="form-group"><label>Description</label><textarea id="cp-desc" placeholder="What's this project about?"></textarea></div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="createProject()">Create Project</button>
    </div>
  `)
}

async function createProject() {
  const name = document.getElementById('cp-name').value.trim()
  if (!name) { document.getElementById('cp-msg').innerHTML = '<div class="error-msg">Project name is required</div>'; return }
  try {
    const project = await api('POST', '/api/projects', {
      name,
      description: document.getElementById('cp-desc').value.trim()
    })
    closeModal()
    toast('Project created!', 'success')
    navigate('project', project.id)
  } catch (err) {
    document.getElementById('cp-msg').innerHTML = `<div class="error-msg">${err.message}</div>`
  }
}

function showCreateTaskModal(projectId) {
  const project = state.currentProject
  showModal(`
    <div class="modal-header">
      <div class="modal-title">Add Task</div>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div id="ct-msg"></div>
    <div class="form-group"><label>Task Title *</label><input id="ct-title" placeholder="What needs to be done?" autofocus></div>
    <div class="form-group"><label>Description</label><textarea id="ct-desc" placeholder="Optional details..."></textarea></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <div class="form-group"><label>Priority</label>
        <select id="ct-priority">
          <option value="low">Low</option>
          <option value="medium" selected>Medium</option>
          <option value="high">High</option>
          <option value="critical">Critical</option>
        </select>
      </div>
      <div class="form-group"><label>Due Date</label><input type="date" id="ct-due"></div>
    </div>
    ${project ? `<div class="form-group"><label>Assign To</label>
      <select id="ct-assignee">
        <option value="">Unassigned</option>
        ${(project.members || []).map(m => `<option value="${m.userId}">${m.user?.name || m.userId}</option>`).join('')}
      </select>
    </div>` : ''}
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="createTask('${projectId}')">Add Task</button>
    </div>
  `)
}

async function createTask(projectId) {
  const title = document.getElementById('ct-title').value.trim()
  if (!title) { document.getElementById('ct-msg').innerHTML = '<div class="error-msg">Title is required</div>'; return }
  try {
    await api('POST', '/api/tasks', {
      projectId,
      title,
      description: document.getElementById('ct-desc')?.value.trim(),
      priority: document.getElementById('ct-priority')?.value,
      dueDate: document.getElementById('ct-due')?.value || null,
      assigneeId: document.getElementById('ct-assignee')?.value || null
    })
    closeModal()
    toast('Task added!', 'success')
    refreshCurrentPage()
  } catch (err) {
    document.getElementById('ct-msg').innerHTML = `<div class="error-msg">${err.message}</div>`
  }
}

function showInviteModal(projectId) {
  showModal(`
    <div class="modal-header">
      <div class="modal-title">Invite Team Member</div>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div id="inv-msg"></div>
    <div class="form-group"><label>Email Address</label><input id="inv-email" type="email" placeholder="colleague@example.com" autofocus></div>
    <div class="form-group"><label>Role</label>
      <select id="inv-role">
        <option value="Member">Member — Can create & manage their own tasks</option>
        <option value="Admin">Admin — Full project control</option>
      </select>
    </div>
    <div style="background:var(--surface2);border-radius:var(--radius-sm);padding:12px;font-size:0.82rem;color:var(--text2);margin-bottom:4px">
      ℹ️ The person must already have a TaskFlow account.
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="inviteMember('${projectId}')">Send Invite</button>
    </div>
  `)
}

async function inviteMember(projectId) {
  const email = document.getElementById('inv-email').value.trim()
  const role = document.getElementById('inv-role').value
  if (!email) { document.getElementById('inv-msg').innerHTML = '<div class="error-msg">Email is required</div>'; return }
  try {
    await api('POST', `/api/projects/${projectId}/members`, { email, role })
    closeModal()
    toast('Member invited!', 'success')
    refreshCurrentPage()
  } catch (err) {
    document.getElementById('inv-msg').innerHTML = `<div class="error-msg">${err.message}</div>`
  }
}

async function removeMember(projectId, userId) {
  if (!confirm('Remove this member from the project?')) return
  try {
    await api('DELETE', `/api/projects/${projectId}/members/${userId}`)
    toast('Member removed', 'info')
    refreshCurrentPage()
  } catch (err) { toast(err.message, 'error') }
}

async function changeMemberRole(projectId, userId, newRole) {
  try {
    await api('PATCH', `/api/projects/${projectId}/members/${userId}/role`, { role: newRole })
    toast('Role updated', 'success')
    refreshCurrentPage()
  } catch (err) { toast(err.message, 'error') }
}

function showModal(html) {
  const container = document.getElementById('modal-container')
  container.innerHTML = `<div class="modal-overlay" onclick="closeModalOutside(event)"><div class="modal">${html}</div></div>`
}

function closeModal() {
  document.getElementById('modal-container').innerHTML = ''
}

function closeModalOutside(e) {
  if (e.target.classList.contains('modal-overlay')) closeModal()
}

// ============================================================
// HELPERS
// ============================================================
function refreshCurrentPage() {
  if (state.currentPage === 'project' && state.currentProject) {
    navigate('project', state.currentProject.id)
  } else {
    navigate(state.currentPage)
  }
}

function esc(str) {
  if (!str) return ''
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')
}

function formatDate(dateStr) {
  if (!dateStr) return ''
  return new Date(dateStr).toLocaleDateString('en-US', { month: 'short', day: 'numeric' })
}

function formatDateTime(dateStr) {
  if (!dateStr) return ''
  return new Date(dateStr).toLocaleDateString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' })
}

function toast(msg, type = 'info') {
  const el = document.createElement('div')
  el.className = `toast ${type}`
  const icons = { success: '✅', error: '❌', info: 'ℹ️' }
  el.innerHTML = `<span>${icons[type]}</span> ${msg}`
  document.getElementById('toast-container').appendChild(el)
  setTimeout(() => el.remove(), 3000)
}
